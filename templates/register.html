<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TULAY – Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Nunito',-apple-system,sans-serif;max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:#0a1628;}
.bg-canvas{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#0a1628 0%,#0d2040 40%,#0f2d1a 100%);}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.5;animation:float 8s ease-in-out infinite;}
.orb1{width:260px;height:260px;background:radial-gradient(circle,#1D9E75,transparent);top:-60px;right:-40px;animation-delay:-1s;}
.orb2{width:200px;height:200px;background:radial-gradient(circle,#185FA5,transparent);bottom:60px;left:-50px;animation-delay:-4s;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-24px);}}
.grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(29,158,117,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(29,158,117,0.05) 1px,transparent 1px);background-size:40px 40px;}
.wrap{position:relative;z-index:10;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;padding:40px 20px 40px;}
.logo-area{text-align:center;margin-bottom:20px;}
.logo-img{height:52px;width:auto;display:block;margin:0 auto 8px;filter:drop-shadow(0 4px 16px rgba(29,158,117,0.5));}
.logo-title{font-size:28px;font-weight:900;color:#fff;letter-spacing:-0.5px;}
.logo-sub{font-size:12px;color:rgba(255,255,255,0.45);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:3px;}
.card{background:rgba(255,255,255,0.07);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:28px;padding:24px 20px;width:100%;border:1px solid rgba(255,255,255,0.1);box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.flash{padding:12px;border-radius:13px;font-size:14px;margin-bottom:14px;font-weight:700;}
.flash.error{background:rgba(220,53,69,0.18);color:#fca5a5;border:1px solid rgba(220,53,69,0.3);}
.flash.success{background:rgba(29,158,117,0.18);color:#6ee7b7;border:1px solid rgba(29,158,117,0.3);}
.card-title{font-size:20px;font-weight:900;color:#fff;margin-bottom:3px;}
.card-sub{font-size:13px;color:rgba(255,255,255,0.4);font-weight:600;margin-bottom:18px;}

/* Social */
.social-btns{display:flex;flex-direction:column;gap:9px;margin-bottom:16px;}
.btn-social{width:100%;padding:13px 16px;border:none;border-radius:14px;font-size:14px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:transform .15s;}
.btn-social:active{transform:scale(0.97);}
.btn-google{background:#fff;color:#1a1a1a;}
.social-icon{width:20px;height:20px;flex-shrink:0;}

.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:rgba(255,255,255,0.2);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
.divider::before,.divider::after{content:'';flex:1;height:.5px;background:rgba(255,255,255,0.1);}

/* Role grid */
.sec{font-size:10px;font-weight:900;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
.rb{padding:14px 8px;border:2px solid rgba(255,255,255,0.1);border-radius:16px;cursor:pointer;font-size:13px;font-weight:800;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);font-family:'Nunito',sans-serif;text-align:center;transition:all .2s;}
.rb .ci{font-size:22px;display:block;margin-bottom:5px;}
.rb .hint{font-size:11px;color:rgba(255,255,255,0.35);font-weight:600;margin-top:3px;}
.rb.active{border-color:#1D9E75;background:rgba(29,158,117,0.14);color:#6ee7b7;}

/* Form fields */
.fg{margin-bottom:12px;}
.fg label{font-size:10px;font-weight:900;color:rgba(255,255,255,0.4);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.1em;}
.fg input{width:100%;padding:13px 14px;border:1.5px solid rgba(255,255,255,0.12);border-radius:13px;font-size:15px;font-family:'Nunito',sans-serif;color:#fff;background:rgba(255,255,255,0.08);-webkit-appearance:none;}
.fg input::placeholder{color:rgba(255,255,255,0.22);}
.fg input:focus{outline:none;border-color:rgba(29,158,117,0.8);}
.btn-p{width:100%;padding:15px;background:linear-gradient(135deg,#1D9E75,#0d7a5a);color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(29,158,117,0.4);transition:transform .15s;margin-top:4px;}
.btn-p:active{transform:scale(0.97);}

.link-row{text-align:center;margin-top:16px;}
.link-row a{color:rgba(255,255,255,0.5);font-size:14px;font-weight:700;text-decoration:none;}
.link-row a strong{color:#6ee7b7;}
</style>
</head>
<body>
<div class="bg-canvas">
  <div class="grid-lines"></div>
  <div class="orb orb1"></div><div class="orb orb2"></div>
</div>
<div class="wrap">
  <div class="logo-area">
    <img src="/static/bridge_logo.png" alt="TULAY" class="logo-img">
    <div class="logo-title">TULAY</div>
    <div class="logo-sub">Join the community</div>
  </div>

  <div class="card">
    <div class="card-title">Create account</div>
    <div class="card-sub">Quick sign-up with social or email below.</div>

    {% with messages=get_flashed_messages(with_categories=true) %}
      {% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}
    {% endwith %}

    <!-- Social sign-up (fastest) -->
    <div class="social-btns">
      <a href="/login/google" class="btn-social btn-google">
        <svg class="social-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Sign up with Google
      </a>
        <svg class="social-icon" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      </a>
    </div>

    <div class="divider">or with email &amp; password</div>

    <form method="POST" action="/register">
      <div class="sec">I am a...</div>
      <div class="role-grid">
        <button type="button" class="rb active" onclick="selRole(this,'resident')">
          <span class="ci">🏠</span><strong>Resident</strong>
          <div class="hint">I need help</div>
        </button>
        <button type="button" class="rb" onclick="selRole(this,'volunteer')">
          <span class="ci">🤝</span><strong>Volunteer</strong>
          <div class="hint">I want to help</div>
        </button>
      </div>
      <input type="hidden" name="role" id="role-in" value="resident">
      <div class="fg"><label>Full name</label><input type="text" name="name" placeholder="e.g. Maria Santos" autocomplete="name" required></div>
      <div class="fg"><label>Email</label><input type="email" name="email" placeholder="you@email.com" autocomplete="email" required></div>
      <div class="fg"><label>Barangay</label><input type="text" name="barangay" placeholder="e.g. Barangay 14, Olongapo" required></div>
      <div class="fg"><label>Password</label><input type="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required></div>
      <div class="fg"><label>Confirm password</label><input type="password" name="confirm" placeholder="Repeat your password" autocomplete="new-password" required></div>
      <button type="submit" class="btn-p">Create account →</button>
    </form>
  </div>

  <div class="link-row">
    Already have an account? <a href="/login"><strong>Log in →</strong></a>
  </div>
</div>
<script>
function selRole(btn,val){
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('role-in').value=val;
}
</script>
</body>
</html>
